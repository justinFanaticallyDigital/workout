<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitTrack - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }
    .logo .fit { font-weight: bold; }
    .logo .track { color: #888888; font-weight: bold; }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      color: #666666;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      font-weight: bold;
    }
    p {
      color: #888888;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      background: #ffffff;
      color: #1a1a1a;
      border: none;
      padding: 0.75rem 2rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
      font-weight: bold;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    .retry-btn:hover { background: #cccccc; }
    .note {
      margin-top: 2rem;
      padding: 1rem;
      background: #2e2e2e;
      border: 1px solid #434343;
      border-radius: 0.375rem;
      color: #888888;
      font-size: 0.75rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="fit">FIT</span><span class="track">TRACK</span>
    </div>
    <div class="icon">&#9888;</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Any workouts in progress are saved locally and will sync when you reconnect.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="note">
      Queued workouts will automatically sync when your connection returns.
    </div>
  </div>
</body>
</html>
