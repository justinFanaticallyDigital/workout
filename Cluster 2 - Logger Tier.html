// ── 2.4 mid-session snapshot (from logger-data.jsx's window.SESSION) ──
// The shared data ships W4 fully logged; derive a realistic mid-session
// state — first two lanes done, the rest open with last-week ghosts.
function makeMidSession(base) {
  const wi = base.currentWeekIdx;
  const COMPLETE = { l1: true, l2: true };
  const lanes = base.lanes.map((lane) => {
    const target = lane.targetSets;
    const w3 = lane.sets[wi - 1] || [];
    const w4 = lane.sets[wi] || [];
    const done = !!COMPLETE[lane.id];
    const today = Array.from({ length: target }, (_, i) => {
      const src = w4[i] || w3[i];
      if (done && src && src.w != null) {
        return { w: src.w, r: src.r, rpe: src.rpe, done: true, warmup: false };
      }
      return { w: null, r: null, rpe: null, done: false, warmup: false };
    });
    return { ...lane, sets: lane.sets.map((arr, i) => (i === wi ? today : arr)) };
  });
  return { ...base, lanes, elapsedMin: 19, restRemaining: 72 };
}

// ── Shared staged-phone wrapper (covers every cluster-2 home/sheet) ──

function NavSlot({ T, tier = 'logger', active }) {

}

}

          <DCArtboard id="act-cardio" label="02 Cardio · distance + HR" width={432} height={858}>
            <ThemedPhone theme={theme} label="2.13 Activity Logger · Cardio" width={410} height={836}>
              <ActivityLogger T={T} type="liss"/>
            </ThemedPhone>
          </DCArtboard>
          <DCArtboard id="act-class" label="03 Class · name + studio" width={432} height={858}>
            <ThemedPhone theme={theme} label="2.13 Activity Logger · Class" width={410} height={836}>
              <ActivityLogger T={T} type="class"/>
            </ThemedPhone>
          </DCArtboard>
          <DCArtboard id="act-custom" label="04 Custom · free label" width={432} height={858}>
            <ThemedPhone theme={theme} label="2.13 Activity Logger · Custom" width={410} height={836}>
              <ActivityLogger T={T} type="custom"/>
            </ThemedPhone>
          </DCArtboard>
        </DCSection>

        {/* ═══════════ 2.14 Single Workout Library ═══════════ */}
        <DCSection
          id="single-workout-library"
          title="2.14 · Single Workout Library"
          subtitle="Browse-and-pick a one-off workout to run now — search + category filter over saved frames and built-in templates. The browse variant of the Saved-frames grid in 2.1 and the launch row in 2.2; reuses the same Frame vocabulary. Search and filters are live; No-results shown in artboard 02."
        >
          <DCArtboard id="swl-default" label="01 Default · frames + templates" width={432} height={1100}>
            <StagedPhone theme={theme} label="2.14 Single Workout Library" withNav={false} height={1078}>
              <SingleWorkoutLibrary T={T}/>
            </StagedPhone>
          </DCArtboard>
          <DCArtboard id="swl-empty" label="02 No results" width={432} height={760}>
            <StagedPhone theme={theme} label="2.14 Single Workout Library · No results" withNav={false} height={738}>
              <SingleWorkoutLibrary T={T} initialQ="zercher"/>
            </StagedPhone>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <ThemeCycler value={theme} onChange={(v) => setTweak('theme', v)}/>
        </TweakSection>

        <TweakSection title="2.2 · Side rail">
          <TweakRadio
            label="Side rail"
            value={railMode}
            options={[{ value: 'rail', label: 'Rail' }, { value: 'chip', label: 'No rail' }]}
            onChange={(v) => setTweak('railMode', v)}/>
          <div style={{ fontSize: 11, color: 'rgba(60,50,40,.6)', lineHeight: 1.4, marginTop: 4 }}>
            Rail = labelled icon column. No rail = a sticky chip opens the nav, content full-width. Locked slots (Program · Gameplan) stay visible for a Logger.
          </div>
        </TweakSection>

        <TweakSection title="Header">
          <TweakRadio
            value={t.headerMode || 'auto'}
            options={[{ value: 'auto', label: 'Auto' }, { value: 'expanded', label: 'Full' }, { value: 'collapsed', label: 'Compact' }]}
            onChange={(v) => setTweak('headerMode', v)}/>
          <div style={{ fontSize: 11, color: 'rgba(60,50,40,.6)', lineHeight: 1.4, marginTop: 4 }}>
            Auto = the header collapses to a compact bar once content scrolls.
          </div>
        </TweakSection>

        <TweakSection title="2.2 · Surfaces">
          <TweakToggle label="Resume card" value={t.showResume} onChange={(v) => setTweak('showResume', v)}/>
          <TweakToggle label="Structure upsell" value={t.showUpsell} onChange={(v) => setTweak('showUpsell', v)}/>
        </TweakSection>

        <TweakSection title="2.4 · Last week's numbers">
          <TweakRadio
            value={t.lastWeekMode}
            onChange={(v) => setTweak('lastWeekMode', v)}
            options={[
              { value: 'ghost', label: 'Ghost inside empty cells' },
              { value: 'row',   label: 'Thin LAST row below today' },
              { value: 'none',  label: 'Hide entirely' },
            ]}
          />
        </TweakSection>

        <TweakSection title="2.4 · Category rail">
          <TweakRadio
            value={t.railStyle}
            onChange={(v) => setTweak('railStyle', v)}
            options={[
              { value: 'rotated-52', label: 'Rotated text · 44px' },
              { value: 'rotated-64', label: 'Rotated text · 56px' },
              { value: 'stripe',     label: 'Thin stripe · 5px' },
              { value: 'chip',       label: 'Chip only · no rail' },
            ]}
          />
        </TweakSection>

        <TweakSection title="About this cluster">
          <div style={{ fontSize: 11.5, color: 'rgba(60,50,40,.7)', lineHeight: 1.45 }}>
            Cluster 2 · Logger Tier — the complete inventory, screens 2.1 → 2.14, all designed + themed. Iron locked (Stardos stencil, brass, Teko). Cycle the theme above to canary the structure across all seven — Blueprint is the contrast canary.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
